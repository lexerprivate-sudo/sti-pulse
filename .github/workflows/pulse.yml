name: Poll eLMS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sti-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll feed and notify
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/poll.mjs

      - name: Save poll state
        if: env.STATE_CHANGED == '1'
        run: |
          git config user.name "sti-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update pulse state [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
