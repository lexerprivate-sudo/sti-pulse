<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>STI Pulse — Offline</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0f14; --panel: #11161e; --line: #1f2836; --text: #e9edf2; --dim: #aeb7c4; --muted: #8b95a6; --accent: #4f8ef7; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center; min-height: 100vh;
        padding: 24px;
      }
      main { max-width: 380px; text-align: center; }
      svg { width: 56px; height: 56px; color: var(--accent); margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0 0 16px; color: var(--dim); }
      dl {
        display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 16px;
      }
      dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
      dd { margin: 0; color: var(--text); }
      a {
        display: inline-block; padding: 12px 20px; border-radius: 8px;
        background: linear-gradient(135deg, #7ab5ff 0%, #4f8ef7 46%, #3f6ee0 100%);
        color: #f4f8ff; text-decoration: none; font-weight: 600;
      }
      small { display: block; margin-top: 16px; color: var(--muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 27h9l4-13 7 22 5-16 4 7h11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>You're offline</h1>
      <p>STI Pulse can't reach eLMS right now — not even for the icon.</p>
      <dl>
        <dt>Last synced</dt><dd id="snap">Checking…</dd>
        <dt>Status</dt><dd>Showing the last saved copy, none if never loaded</dd>
      </dl>
      <a href="./">Open saved dashboard</a>
      <small>Reconnect on school Wi-Fi, then reopen STI Pulse to refresh.</small>
    </main>
    <script>
      (function () {
        var el = document.getElementById("snap");
        try {
          var cached = localStorage.getItem("sti-data-cache");
          if (!cached) { el.textContent = "No snapshot saved on this device yet."; return; }
          var data = JSON.parse(cached);
          var t = data.generatedAt || data.lastPoll;
          el.textContent = t
            ? new Date(t).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
            : "Unknown";
        } catch (e) {
          el.textContent = "Could not read saved data.";
        }
      })();
    </script>
  </body>
</html>
